name: 生成签名密钥（一次性）

# ⚠️ 一次性任务，平时不要运行。
# 只有在需要新建 release keystore 时才手动触发：
#   1. Actions → 左侧「生成签名密钥（一次性）」→ Run workflow
#   2. 运行结束后打开这次记录，在「生成 keystore 并输出 base64」步骤的日志里
#      复制 KEYSTORE_BUNDLE 这一整段（推荐，只需要建一个 Secret）
#   3. 到仓库 Settings → Secrets and variables → Actions，新建一个 Repository secret：
#      名称必须完全一致：KEYSTORE_BUNDLE
#   4. 回到 Actions，删除这次运行记录（日志里含密钥材料）
#   5. 删除本文件 .github/workflows/_generate-keystore.yml
#
# 如果你已经有三项旧 Secret（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS），
# 构建工作流仍然兼容；但短值存不进去时，改用单个 KEYSTORE_BUNDLE 即可。
#
# 注意：公开仓库的 Actions 日志任何人都能看。如果仓库是公开的，
# 复制完 Secrets 后务必删除本次运行；更稳妥的做法是把仓库设为私有。

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 keystore 并输出 base64
        env:
          KEY_ALIAS: qingjihua
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 16)"
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/release.keystore \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=AeroPlan, OU=Android, O=AeroPlan, L=Beijing, ST=Beijing, C=CN"
          keytool -list -keystore keystore/release.keystore \
            -storetype PKCS12 -storepass "$PASSWORD" > /dev/null
          FINGERPRINT="$(keytool -list -v -keystore keystore/release.keystore \
            -storetype PKCS12 -storepass "$PASSWORD" | grep -i 'SHA256:' | head -n 1 | sed 's/^[[:space:]]*//')"
          B64="$(base64 -w 0 keystore/release.keystore)"
          BUNDLE_B64="$(printf '{"keystore":"%s","password":"%s","alias":"%s"}' \
            "$B64" "$PASSWORD" "$KEY_ALIAS" | base64 -w 0)"

          echo "===== 官方签名指纹（填到 README 与关于页）====="
          echo "$FINGERPRINT"
          echo ""

          echo "===== 推荐：只建一个 Secret，名称必须完全一致 ====="
          echo "KEYSTORE_BUNDLE"
          echo "$BUNDLE_B64"
          echo "===== 复制到此结束（整行复制，不要换行）====="
          echo ""

          echo "===== 兼容备选：三项旧 Secret ====="
          echo "KEYSTORE_BASE64"
          echo "$B64"
          echo ""
          echo "KEYSTORE_PASSWORD"
          echo "$PASSWORD"
          echo ""
          echo "KEY_ALIAS"
          echo "$KEY_ALIAS"
          echo "===== 备选结束 ====="

          {
            echo "## 签名密钥已生成"
            echo ""
            echo "推荐只建一个 Secret，名称必须是 KEYSTORE_BUNDLE（大小写、下划线完全一致）："
            echo ""
            echo '```'
            echo "$BUNDLE_B64"
            echo '```'
            echo ""
            echo "兼容备选（三项旧 Secret，构建工作流仍然支持）："
            echo ""
            echo '```'
            echo "KEYSTORE_BASE64"
            echo "$B64"
            echo ""
            echo "KEYSTORE_PASSWORD"
            echo "$PASSWORD"
            echo ""
            echo "KEY_ALIAS"
            echo "$KEY_ALIAS"
            echo '```'
            echo ""
            echo "官方签名指纹（填到 README 与关于页的 \`OFFICIAL_CERT_SHA256\`）："
            echo ""
            echo '```'
            echo "$FINGERPRINT"
            echo '```'
            echo ""
            echo "复制完成后请删除本次运行记录，并删除本工作流文件。"
          } >> "$GITHUB_STEP_SUMMARY"

          # 本次运行结束后不保留任何文件
          rm -rf keystore
